{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Liquidación Individual</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/gestion_datos.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
    <style>
        .messages {
            list-style-type: none;
            padding: 0;
            margin-bottom: 20px;
        }

        .messages li {
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
        }

        .messages .success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }

        .messages .error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }

        .messages .warning {
            background-color: #fff3cd;
            color: #856404;
            border-color: #ffeeba;
        }
    </style>
</head>

<body>
    <div class="header"> {% include 'includes/navbar.html' %}</div>
    <main>{% block content %} {% endblock %}</main>

    <div class="container">
        <h2>Crear Liquidación Individual</h2>

        }
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Calcular y Guardar Liquidación</button>
        </form>
        <a href="{% url 'lista_liquidaciones' %}" class="btn btn-secondary mt-3">Volver a la Lista de Liquidaciones</a>
    </div>

    <script src="{% static 'js/navbar.js' %}"></script>
</body>

</html>
