{% load static %}


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/gestion_datos.css' %}">
    <link rel="stylesheet" href="{% static 'css/form.css' %}">

</head>

<body>
    <div class="header"> {% include 'includes/navbar.html' %}</div>
    {% block content %}
    <div class="container">

        <h2>{{ titulo }}</h2>

        <div class="row">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }} <button type="submit" class="btn btn-primary mt-3">Guardar Préstamo</button>
                <a href="{% url 'listar_prestamos' %}" class="btn btn-secondary mt-3">Cancelar</a>
            </form>

        </div>
        {% endblock %}
</body>

</html>
