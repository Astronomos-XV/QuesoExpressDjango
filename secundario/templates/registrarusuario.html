{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Superusuario</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
<div class="container">
    <h2>Crear Usuario Maestro</h2>
    {% for msg in messages %}<p style="color:red;">{{ msg }}</p>{% endfor %}
    <form method="post">
        {% csrf_token %}
        <p>Código: <input type="password" name="codigo" required></p>
        <p>Usuario: <input type="text" name="username" required></p>
        <p>Contraseña: <input type="password" name="password" required></p>
        <button type="submit">Crear superusuario</button>

    </form>
    <a class="btn" href="{% url 'home' %}">Volver a Inicio</a>
    <a class="btn" href="{% url 'crear_usuario_normal' %}">Administrador</a>

</div>
</body>
</html>
