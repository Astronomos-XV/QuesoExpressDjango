{% extends 'home.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>{{ titulo }}</h2>
    <hr>
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }} {# O {{ form|crispy }} si lo instalaste #}
                        <button type="submit" class="btn btn-primary mt-3">Guardar Cambios</button>
                        <a href="{% url 'listar_prestamos' %}" class="btn btn-secondary mt-3">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
